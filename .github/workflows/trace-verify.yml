name: Trace Verify

on:
  push:
    paths:
      - "scripts/build.sh"
      - "scripts/utils.sh"
      # The APKMirror picker has its own test step below, so a change to only the
      # python side of it must still run the suite (the bash mirror has to agree).
      - "scripts/apkmirror_search.py"
      # The Uptodown resolver takes the preferred-format chain as its own argument;
      # test_preferred_format.sh asserts its class-collapse parity with utils.sh.
      - "scripts/uptodown.py"
      # The version watcher is tested by test_version_watch.sh, which drives these two
      # scripts for real (sandbox cwd, stubbed scrapes), so a change to either must run
      # the suite rather than only reach the next scheduled watcher tick.
      - ".github/scripts/ci_fetch_app_versions.sh"
      - ".github/scripts/ci_compare_app_versions.sh"
      # The pre-release marker list is owned by .github/scripts/channels.py and
      # mirrored by the engine, so a change on either side must run the parity suite
      # rather than surface as a source whose pre-release tags get recorded as its
      # stable head.
      - ".github/scripts/channels.py"
      - ".github/scripts/sync_patch_sources.py"
      - ".github/scripts/compile_patch_configs.py"
      - ".github/traces/**"
  workflow_dispatch:

concurrency:
  group: trace-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run trace harness verify
        run: |
          sudo apt-get update && sudo apt-get install -y jq || true
          bash .github/traces/trace_runner.sh verify

      - name: Run helper regression tests
        run: |
          bash .github/traces/test_patch_versions.sh
          bash .github/traces/test_cache_helpers.sh
          bash .github/traces/test_bundle_helpers.sh
          bash .github/traces/test_arch_strip.sh
          bash .github/traces/test_apkmirror_variants.sh
          bash .github/traces/test_apkmirror_release_lookup.sh
          bash .github/traces/test_preferred_format.sh
          bash .github/traces/test_direct_source.sh
          bash .github/traces/test_fdroid_source.sh
          bash .github/traces/test_config_rearm.sh
          bash .github/traces/test_channel_markers.sh
          bash .github/traces/test_archive_mirror.sh
          bash .github/traces/test_archive_pages.sh
          bash .github/traces/test_version_watch.sh
