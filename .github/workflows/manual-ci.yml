name: Manual CI

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Select the config file to use"
        required: true
        type: choice
        default: ".github/configs/config.manual.toml"
        options:
          - ".github/configs/config.manual.toml"
          - ".github/configs/config.beta.updated.json"
          - ".github/configs/config.stable.updated.json"
      remove_apks:
        description: "Optional: APKs to remove from cache (space-separated, e.g., com.brave.browser-1.93.138-*.apk)"
        required: false
        type: string
        default: ""

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build_manual:
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ inputs.config_file }}
      remove_apks: ${{ inputs.remove_apks }}
    secrets: inherit

  trigger_cleanup:
    needs: [build_manual]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_notify_failure:
    needs: [build_manual]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "Manual CI"
    secrets: inherit
