name: Notify

on:
  issues:
    types: [ opened, closed, reopened ]
  pull_request:
    types: [ opened, closed, reopened ]
  workflow_call:
    inputs:
      workflow_name:
        required: false
        type: string
      already_reported:
        required: false
        type: boolean
        default: false

jobs:
  enqueue:
    if: ${{ github.event_name == 'issues' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      ACTOR: ${{ github.actor }}
      REPO: ${{ github.repository }}
      ACTION: ${{ github.event.action }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      PR_NUM: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_COMMITS: ${{ github.event.pull_request.commits }}
      PR_FILES: ${{ github.event.pull_request.changed_files }}
      PR_ADD: ${{ github.event.pull_request.additions }}
      PR_DEL: ${{ github.event.pull_request.deletions }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      ISSUE_NUM: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Enqueue event
        run: bash .github/scripts/notify_enqueue.sh

  drain:
    needs: enqueue
    if: ${{ github.event_name == 'issues' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: notify-debounce
      cancel-in-progress: false
    env:
      NOTIFY_DEBOUNCE_SECONDS: "60"
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      # No fallback chat or topic: an unset variable fails this job instead of
      # silently batching issue/PR alerts into a stale chat. The queue keeps its
      # lines, so the next drain retries once the variables exist.
      TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
      TG_THREAD_NOTIFY: ${{ vars.TG_THREAD_NOTIFY }}
      # Optional Discord mirror of the drained batch (#github-log). It is never the
      # reason the queue stays unpruned: notify_drain.sh treats it as best-effort.
      DISCORD_WEBHOOK_GITHUB_LOG: ${{ secrets.DISCORD_WEBHOOK_GITHUB_LOG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Debounce window
        run: sleep "${NOTIFY_DEBOUNCE_SECONDS:-60}"

      - name: Drain and send batch
        run: bash .github/scripts/notify_drain.sh

  # The alert job answers a call, not an event: inside a called workflow `github` is
  # the CALLER run's context, so `github.event_name` is `schedule` or
  # `workflow_dispatch`, never `workflow_call`. The equality form matched nothing and
  # the generic failure alert never fired once in 28 CI / Manual CI runs, including
  # three that failed. What separates a call from this file's own triggers is the
  # absence of the two events handled by the jobs above.
  notify:
    if: ${{ github.event_name != 'issues' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Send failure alert to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_NOTIFY }}
          DISCORD_WEBHOOK_GITHUB_LOG: ${{ secrets.DISCORD_WEBHOOK_GITHUB_LOG }}
          WF_NAME: ${{ inputs.workflow_name }}
          ALREADY_REPORTED: ${{ inputs.already_reported }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/notify_send_telegram.sh
