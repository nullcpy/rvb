name: Cleanup

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: clean
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete Older Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          delete_tags: true
          releases_keep_latest: 98
          delete_workflows: true
          workflows_keep_day: 3
          releases_keep_keyword: stable/beta
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Archive Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/cleanup-archive-assets.py

      - name: Cleanup Update Branch Changelogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/cleanup_update_branch.sh

      - name: Synchronize Website Catalog Data
        env:
          WEBSITE_REPO_TOKEN: ${{ secrets.APKS_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main || true
          python3 .github/scripts/sync_website_catalog.py

      - name: Dispatch Website Deployment (Manual Cleanup Only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.APKS_REPO_TOKEN }}
        run: |
          curl -f -X POST https://api.github.com/repos/nullcpy/nullcpy.github.io/dispatches \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token $DISPATCH_TOKEN" \
          -d '{"event_type": "update-catalog-cache"}'

