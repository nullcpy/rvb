name: "📱 Request app"
description: "Request a new app to be built."
title: "request: [App Name]"
labels: ["request"]
body:
  - type: markdown
    attributes:
      value: |
        > *WARNING:* Failing to properly fill out this form will result in your issue being closed without warning. These requests are monitored and processed by an AI agent.
  - type: input
    id: app-name
    attributes:
      label: App name
      description: The name of the application.
    validations:
      required: true
  - type: input
    id: pkg-name
    attributes:
      label: Package name
      description: The package name of the app (e.g., com.example.app). You can find this in the patch repo's `patches-list.json` or in the app's Play Store URL.
    validations:
      required: true
  - type: input
    id: play-store
    attributes:
      label: Play Store link
      description: Search on [Play Store](https://play.google.com/store/apps) and provide the link.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        **APK Download Links**
        > *CRITICAL:* You MUST provide as many download links as possible! These websites have aggressive anti-bot scraping protections, so if you only provide one link, the build will likely fail. At least one link is absolutely required to submit the request.
  - type: input
    id: uptodown
    attributes:
      label: Uptodown link
      description: Search on [Uptodown](https://en.uptodown.com/android) and provide the link.
    validations:
      required: false
  - type: input
    id: apkmirror
    attributes:
      label: APKMirror link
      description: Search on [APKMirror](https://www.apkmirror.com/) and provide the link.
    validations:
      required: false
  - type: input
    id: apkpure
    attributes:
      label: APKPure link
      description: Search on [APKPure](https://apkpure.com/) and provide the link.
    validations:
      required: false
  - type: input
    id: apkcombo
    attributes:
      label: APKCombo link
      description: Search on [APKCombo](https://apkcombo.com/) and provide the link.
    validations:
      required: false
  - type: input
    id: github-apk
    attributes:
      label: GitHub APK link
      description: If the APK is available on GitHub releases, please also provide the link.
    validations:
      required: false
  - type: input
    id: patch-repo
    attributes:
      label: Patch repo link
      description: Link to the repository containing the patches.
    validations:
      required: true
  - type: dropdown
    id: default-patches
    attributes:
      label: Are all patches applied by default?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: input
    id: included-patches
    attributes:
      label: Included Patches
      description: If you answered "No" above, list the exact patch names to include, separated by commas and enclosed in single quotes (e.g., 'Patch One', 'Patch Two'). Look at the patch repo's `patches-list.json`.
    validations:
      required: false
  - type: input
    id: excluded-patches
    attributes:
      label: Excluded Patches
      description: If you answered "No" above, list the exact patch names to exclude, separated by commas and enclosed in single quotes (e.g., 'Patch One', 'Patch Two').
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: There is no existing app request and this is not a duplicate.
          required: true
        - label: This app with this patch is not already built by the builder.
          required: true
