# patches-version = "dev"
# cli-version = "dev"
enable-module-update = true

[threads-morphe]
enabled = true
pkg-name = "com.instagram.barcelona"
app-name = "threads"
rv-brand = "morphe"
build-mode = "apk"
arch = "both"
patches-source = "durgesh0505/chiggi_morphe_patches"
excluded-patches = "'Change app name' 'Change package name'"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://threads.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/threads-an-instagram-app"
dpi = "nodpi anydpi auto"
# archive-dlurl = "https://archive.org/download/geologically/apks/com.instagram.barcelona"

[tumblr-morphe]
enabled = true
pkg-name = "com.tumblr"
app-name = "tumblr"
rv-brand = "morphe"
build-mode = "apk"
arch = "both"
patches-source = "arandomhooman/hoomans-morphe-patches"
uptodown-dlurl = "https://tumblr.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/tumblr-inc/tumblr"
dpi = "nodpi anydpi auto"
# archive-dlurl = "https://archive.org/download/geologically/apks/com.tumblr"


