# patches-version = "latest"
# cli-version = "dev"
enable-module-update = true

[titanium-browser-morphe]
enabled = true
pkg-name = "io.github.jqssun.helium"
app-name = "titanium-browser"
rv-brand = "morphe"
build-mode = "apk"
arch = "both"
patches-source = "dh6k/morphe-patches"
included-patches = "'Keep Helium Child Processes Alive'"
cli-source = "MorpheApp/morphe-desktop"
# dpi = "nodpi anydpi auto"
apkpure-dlurl = "https://apkpure.com/helium-browser/io.github.jqssun.helium"
apkcombo-dlurl = "https://apkcombo.com/titanium-browser/io.github.jqssun.helium"
github-dlurl = "https://github.com/nullcpy/apks/releases/tag/io.github.jqssun.helium"





