parallel-jobs = 1
# patches-version = "dev"
# cli-version = "dev"
enable-module-update = true

[google-photos-morphe-alt]
enabled = true
app-name = "google-photos"
rv-brand = "morphe-alt"
build-mode = "both"
arch = "both"
patches-source = "rushiranpise/morphe-patches"
included-patches = "'AMOLED dark theme' 'Change package name' 'Enable DCIM folders backup control' 'Fix DCIM folder classification' 'GmsCore support'"
