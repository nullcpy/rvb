# Both Discord bundles are injected with JingMatrix LSPatch, the same patcher the
# reference non-root aggregator uses for RevengeXposed: LSPatch's CLI loads its own
# bundled JKS keystore through KeyStore.getDefaultType(), so it needs no
# BouncyCastle provider on the runner (NPatch hard-codes getInstance("BKS")).
# No patcher-args: LSPatch's signature-bypass default is already 0 (disable), and
# --injectdex is only for modules that must hook isolated sub-processes.
cli-source = "JingMatrix/LSPatch"

[Discord-revenge]
enabled = true
patches-source = "revenge-mod/revenge-xposed"
patches-version = "both"
arch = "all"
brand = "revenge"
pkg-name = "com.discord"
app-name = "Discord"
apkmirror-dlurl = "https://www.apkmirror.com/apk/discord/discord-chat-for-gamers"
apkcombo-dlurl = "https://apkcombo.com/discord/com.discord"

[Discord-rain]
enabled = true
patches-source = "raincord/rainXposed"
patches-source-host = "codeberg"
arch = "all"
patches-version = "stable"
brand = "rain"
pkg-name = "com.discord"
app-name = "Discord"
apkmirror-dlurl = "https://www.apkmirror.com/apk/discord/discord-chat-for-gamers"
apkcombo-dlurl = "https://apkcombo.com/discord/com.discord"
